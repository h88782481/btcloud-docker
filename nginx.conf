# btcloud Docker 内部 Nginx 配置
# 由宝塔 Nginx 反代到本 Nginx（127.0.0.1:8080）
# 本 Nginx 处理静态资源 + 转发 PHP 到 PHP-FPM 容器

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # 大文件上传/超时（宝塔插件包较大）
    client_max_body_size 1024M;
    client_body_timeout 600s;
    send_timeout 600s;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_connect_timeout 60s;

    # 保留客户端真实 IP（从宝塔 Nginx 传递过来）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/btcloud_access.log;
    error_log  /var/log/nginx/btcloud_error.log;

    # ThinkPHP 伪静态
    location / {
        try_files $uri $uri/ /index.php$is_args$query_string;
    }

    # PHP 处理
    location ~ \.php(.*)$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        include        fastcgi_params;
    }

    # 禁止访问敏感目录
    location ~ ^/(config|app|route|vendor|thinkphp|extend)/ {
        deny all;
        return 404;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
