# btcloud Docker 内部 Nginx 配置（加载路径: /etc/nginx/http.d/default.conf）
# 由宝塔 Nginx 反代到本容器（127.0.0.1:8080），容器内 Nginx 与 PHP-FPM 走本机回环通信
#
# 伪静态使用宝塔面板 "ThinkPHP" 标准规则
# 注: 站点根目录是 public/，runtime、app 等源码目录本身不在 web 目录下，无需额外屏蔽

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # 大文件上传/超时（宝塔插件包较大）
    client_max_body_size 1024M;
    client_body_timeout 600s;
    send_timeout 600s;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_connect_timeout 60s;

    # 保留客户端真实 IP（宝塔 Nginx 反代 → docker 网关，源地址是内网 IP）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/btcloud_access.log;
    error_log  /var/log/nginx/btcloud_error.log;

    # ThinkPHP 伪静态
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    # PHP 处理
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # 脚本文件必须真实存在，防止 xxx.jpg/xxx.php 之类的路径被交给 php-fpm
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
