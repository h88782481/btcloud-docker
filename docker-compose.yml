name: btcloud

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        # 必填：flucont/btcloud 的完整 Release tag，按上游原样填写。
        BTCLOUD_RELEASE_TAG: ""
    image: btcloud-app:local
    container_name: btcloud
    restart: unless-stopped
    init: true
    # 请求最多执行 600 秒，再给数据库留出关闭时间。
    stop_grace_period: 11m
    environment:
      # 必填：http(s)://域名，可带端口，不带路径或末尾斜杠。
      BTCLOUD_DOMAIN: ""
      MYSQL_DATABASE: "btcloud"
      MYSQL_USER: "btcloud"
      # 必填；密码中的 $ 在 Compose 中写成 $$。
      MYSQL_PASSWORD: ""
      # 完成后台宝塔接口配置后开启，自动同步插件列表并增量下载插件包。
      PLUGIN_SYNC_ENABLED: "false"
      # 每轮执行结束后的等待时间，单位秒；86400 = 24 小时。
      PLUGIN_SYNC_INTERVAL: "86400"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./data/btcloud:/var/www/html
      - ./data/mysql:/var/lib/mysql
      - ./nginx.conf:/etc/nginx/http.d/default.conf:ro
